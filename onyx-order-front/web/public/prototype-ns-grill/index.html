<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Prototype interactif du parcours de commande NS Grill.">
  <title>NS Grill · Commande</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <button class="brand" data-go="home" aria-label="Accueil NS Grill">NS <span>GRILL</span></button>
    <button class="header-cart" data-go="cart" aria-label="Panier">Panier <b id="cart-count">0</b></button>
  </div></header>
  <main id="app" tabindex="-1" class="wrap" aria-busy="true">
    <div class="skeleton hero-skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </main>
  <footer class="site-footer"><div class="wrap">
    <span>Prototype NS Grill</span><button data-go="design">Composants</button>
  </div></footer>
  <div id="dock"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
